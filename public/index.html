<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPR Kill Team VTT - Lobby</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center font-sans p-4">
  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 space-y-5">
    <h1 class="text-2xl font-bold tracking-wider text-amber-500 text-center">🛡️ OPR Kill Team VTT</h1>

    <div id="formView" class="space-y-5">
      <div>
        <label class="text-xs font-semibold uppercase text-slate-400">Your nickname</label>
        <input id="nick" maxlength="16" placeholder="e.g. Commander" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-500">
      </div>
      <button id="btnCreate" class="w-full bg-amber-600 hover:bg-amber-500 font-bold py-2.5 rounded-lg shadow transition">⚔️ Create room</button>
      <div class="flex items-center space-x-3 text-xs text-slate-500"><div class="flex-1 border-t border-slate-700"></div><span>or join a friend</span><div class="flex-1 border-t border-slate-700"></div></div>
      <div class="flex space-x-2">
        <input id="code" maxlength="5" placeholder="ROOM CODE" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-center tracking-[0.3em] uppercase font-mono focus:outline-none focus:border-amber-500">
        <button id="btnJoin" class="bg-blue-600 hover:bg-blue-500 font-bold px-5 rounded-lg shadow transition">Join</button>
      </div>
      <button id="btnWatch" class="w-full text-xs text-slate-300 hover:text-white border border-slate-700 hover:border-slate-500 rounded-lg py-2 transition">👁 Watch a game as spectator (uses the code above)</button>
      <div id="error" class="text-sm text-red-400 text-center min-h-[20px]"></div>
    </div>

    <div id="waitView" class="hidden space-y-4 text-center">
      <p class="text-sm text-slate-400">Share this code with your opponent:</p>
      <div id="roomCode" class="text-4xl font-mono font-black tracking-[0.35em] text-amber-400 bg-slate-900 border border-slate-700 rounded-xl py-4"></div>
      <button id="btnCopy" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded">Copy code</button>
      <p id="waitText" class="text-sm text-slate-300 animate-pulse">Waiting for your opponent to join…</p>
      <button id="btnLeave" class="text-xs text-slate-400 hover:text-red-400 underline">Leave room</button>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const socket = io();
    const nickInput = $('nick');
    nickInput.value = localStorage.getItem('vtt_nick') || '';

    const fail = (msg) => { $('error').textContent = msg; };
    function showWaiting(code) {
      $('formView').classList.add('hidden');
      $('waitView').classList.remove('hidden');
      $('roomCode').textContent = code;
    }
    function enter(res, nick) {
      sessionStorage.setItem('vtt_session', JSON.stringify({ code: res.code, token: res.token, role: res.role, nick }));
      showWaiting(res.code);
      if (res.role === 'S') $('waitText').textContent = 'Waiting for the game to start…';
    }
    function getNick() {
      const n = nickInput.value.trim();
      if (!n) { fail('Please enter a nickname first.'); nickInput.focus(); return null; }
      localStorage.setItem('vtt_nick', n);
      return n;
    }

    $('btnCreate').onclick = () => {
      const nick = getNick(); if (!nick) return;
      socket.emit('create_room', { nick }, (res) => res.ok ? enter(res, nick) : fail(res.error));
    };
    const join = () => {
      const nick = getNick(); if (!nick) return;
      const code = $('code').value.trim().toUpperCase();
      if (code.length < 5) return fail('Enter the 5-character room code.');
      socket.emit('join_room', { nick, code }, (res) => res.ok ? enter(res, nick) : fail(res.error));
    };
    $('btnJoin').onclick = join;
    $('btnWatch').onclick = () => {
      const nick = getNick(); if (!nick) return;
      const code = $('code').value.trim().toUpperCase();
      if (code.length < 5) return fail('Enter the 5-character room code.');
      socket.emit('join_room', { nick, code, spectate: true }, (res) => res.ok ? enter(res, nick) : fail(res.error));
    };
    $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });
    $('code').addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase(); });
    $('btnCopy').onclick = () => navigator.clipboard?.writeText($('roomCode').textContent);
    $('btnLeave').onclick = () => {
      socket.emit('leave_room');
      sessionStorage.removeItem('vtt_session');
      location.reload();
    };

    // Game starts as soon as both players are in the room
    socket.on('room', (r) => {
      if (r.started && sessionStorage.getItem('vtt_session')) {
        $('waitText').textContent = 'Opponent found! Starting…';
        setTimeout(() => location.href = '/game.html', 600);
      }
    });

    // Refresh / returning player: restore the session
    socket.on('connect', () => {
      const s = JSON.parse(sessionStorage.getItem('vtt_session') || 'null');
      if (!s) return;
      socket.emit('rejoin', { code: s.code, token: s.token }, (res) => {
        if (!res.ok) return sessionStorage.removeItem('vtt_session');
        if (res.started) location.href = '/game.html'; else showWaiting(s.code);
      });
    });
  </script>
</body>
</html>
